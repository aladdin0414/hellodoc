# Spring Boot Production Properties

# Database Connection (Supports DB_URL or SPRING_DATASOURCE_URL)
spring.datasource.url=${DB_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/hellodoc}}
spring.datasource.username=${DB_USERNAME:${SPRING_DATASOURCE_USERNAME:postgres}}
spring.datasource.password=${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:postgres}}

# JPA/Hibernate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false


# Connection Pool (Hikari)
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.connection-timeout=30000

# Security and JWT
# jwt.secret=${JWT_SECRET}
# jwt.expiration=86400000

# Logging
logging.level.root=INFO
logging.level.com.nopkg=INFO
logging.file.name=logs/hellodoc.log
logging.logback.rollingpolicy.max-history=30
logging.logback.rollingpolicy.max-file-size=10MB

# Server
server.port=8080
server.forward-headers-strategy=native
server.servlet.context-path=/api

# SpringDoc / OpenAPI (Disabled in production for security)
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# File Upload
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
