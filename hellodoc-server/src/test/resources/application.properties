spring.application.name=hellodoc-test
spring.datasource.url=jdbc:h2:mem:hellodoc_${random.uuid};MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;INIT=CREATE DOMAIN IF NOT EXISTS ltree AS VARCHAR\\;CREATE DOMAIN IF NOT EXISTS tsvector AS VARCHAR
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.sql.init.mode=never
spring.session.jdbc.initialize-schema=always
jwt.secret=change_this_dev_secret_key_please_change_this_dev_secret_key_please_1234
jwt.expiration=3600000
jwt.refresh-expiration=604800000
auth.password.encoder=bcrypt
logging.level.org.springframework.security=DEBUG
app.database.initializer.enabled=false
admin.password=111111
