services:
  # HelloDoc PostgreSQL 数据库
  hellodoc-db:
    image: postgres:15-alpine
    container_name: hellodoc-db
    restart: always
    environment:
      POSTGRES_DB: hellodoc
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      TZ: Asia/Shanghai
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  # HelloDoc Web/后端 统一容器服务 (来自 Docker Hub)
  hellodoc:
    image: ${DOCKER_IMAGE:-aladdin0414/hellodoc:latest}
    container_name: hellodoc
    restart: always
    depends_on:
      hellodoc-db:
        condition: service_healthy
    ports:
      - "${SERVER_PORT:-8080}:8080"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      - DB_URL=jdbc:postgresql://hellodoc-db:5432/hellodoc
      - DB_USERNAME=${DB_USERNAME:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:?Set DB_PASSWORD in .env}
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in .env}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o}
      - FILE_UPLOAD_DIR=/app/data
      - TZ=Asia/Shanghai
