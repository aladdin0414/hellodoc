name: Build and Push Docker Image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.20.2'

      - name: Set up npm
        run: npm install --global npm@11.6.2

      - name: Make build script executable
        run: chmod +x build.sh publish-docker.sh

      - name: Build Application Package
        run: ./build.sh

      - name: Show npm debug logs
        if: failure()
        shell: bash
        run: |
          shopt -s nullglob
          for log_file in /home/runner/.npm/_logs/*-debug-0.log; do
            echo "::group::${log_file##*/}"
            tail -n 500 "$log_file"
            echo "::endgroup::"
          done

      - name: Upload npm debug logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: npm-debug-logs
          path: /home/runner/.npm/_logs/*-debug-0.log
          if-no-files-found: warn
          retention-days: 7

      - name: Extract Tag Version
        id: get_version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION=$(grep "^version =" hellodoc-server/build.gradle | sed "s/version = '\(.*\)'/\1/" | tr -d '\r')
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "Building version: ${VERSION}"

      - name: Set up QEMU (for multi-arch)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          build-args: |
            JAR_FILE=dist/hellodoc-${{ env.VERSION }}/hellodoc-${{ env.VERSION }}.jar
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/hellodoc:${{ env.VERSION }}
            ${{ secrets.DOCKERHUB_USERNAME }}/hellodoc:latest
