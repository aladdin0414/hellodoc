<?xml version="1.0" encoding="UTF-8"?>
<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 渐变色：科技蓝过渡到活力紫 -->
    <linearGradient id="mainGradient" x1="45" y1="40" x2="160" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    
    <!-- 强调色：明亮的黄色点缀 -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 左侧加粗支柱 -->
  <rect x="40" y="40" width="32" height="120" rx="16" fill="url(#mainGradient)"/>
  
  <!-- 右侧加粗支柱 -->
  <rect x="128" y="40" width="32" height="120" rx="16" fill="url(#mainGradient)"/>
  
  <!-- 中间连接横梁：采用圆角色块 -->
  <rect x="70" y="85" width="60" height="30" rx="4" fill="url(#mainGradient)"/>
  
  <!-- 文档折角：更具立体感的白色层叠 -->
  <path d="M128 40H160V72L128 40Z" fill="#ffffff" fill-opacity="0.2"/>
  <path d="M160 72H140C133.373 72 128 66.627 128 60V40L160 72Z" fill="#ffffff" fill-opacity="0.4"/>

  <!-- 亮点点缀：增加协同感和动感 -->
  <circle cx="100" cy="150" r="10" fill="#f59e0b" filter="url(#glow)">
    <animate attributeName="r" values="8;11;8" dur="2s" repeatCount="indefinite" />
  </circle>
</svg>
